<!DOCTYPE html>

  <title>Тени Подгорья</title>
  <!-- user-scalable=no: на телефоне игра управляется касаниями, и двойной тап
       по кнопке умения не должен вместо удара приближать страницу. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12121a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/visual-assets.css">
  <link rel="stylesheet" href="css/room-visual.css">
  <link rel="stylesheet" href="css/room-route.css">
  <link rel="stylesheet" href="css/front-menu-v4.css">
</head>
<body>

  <script src="js/game.js"></script>
  <script src="js/room-visual-art.js"></script>
  <script src="js/room-visual-preview.js"></script>
  <script src="js/room-route-data.js"></script>
  <script src="js/room-route.js"></script>

  <script src="js/biome-config-v3.js"></script>
  <script src="js/expedition-levels.js"></script>

  <script src="js/main.js"></script>
  <!-- Регистрация service worker. Встроенные скрипты не попадают в dist/index.html
       (tools/bundle.js собирает только те, что с src), и это правильно: автономный
       файл открывают с диска, где service worker недоступен и не нужен. -->
  <script>
    // Только по http(s): по file:// регистрация выбрасывает исключение,
    // а двойной клик по index.html должен работать по-прежнему.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
