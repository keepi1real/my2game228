<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тени Подгорья</title>
<style>
:root {
  --bg: #0b0b10;
  --panel: rgba(18, 18, 26, 0.96);
  --panel-border: #3a3a52;
  --text: #e6e2d3;
  --muted: #9a97a8;
  --accent: #d4a94a;
  --accent2: #6fc3df;
  --danger: #e05a4a;
  --good: #7cd67c;
  --common: #cfcfcf;
  --rare: #5aa9ff;
  --epic: #c77dff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}
#game-root {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
#game {
  background: #000;
  image-rendering: pixelated;
  max-width: 100vw; max-height: 100vh;
  aspect-ratio: 1024 / 640;
  width: min(100vw, calc(100vh * 1024 / 640));
  height: auto;
  display: block;
  cursor: crosshair;
}
#ui {
  position: absolute; inset: 0;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
#ui > * { pointer-events: auto; }
.overlay {
  position: absolute; inset: 0;
  background: rgba(4, 4, 8, 0.82);
  display: flex; align-items: center; justify-content: center;
  animation: fadein 0.2s ease-out;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.panel {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 24px 28px;
  min-width: 420px; max-width: 900px; max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.panel h1 { margin: 0 0 6px; font-size: 34px; color: var(--accent); letter-spacing: 1px; text-align: center; }
.panel h2 { margin: 0 0 14px; font-size: 22px; color: var(--accent); }
.panel h3 { margin: 12px 0 6px; font-size: 16px; color: var(--accent2); }
.subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; }
.menu-buttons { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
button {
  font: inherit; font-size: 16px;
  background: #22222f; color: var(--text);
  border: 1px solid var(--panel-border);
  border-radius: 6px; padding: 10px 18px;
  cursor: pointer; transition: background 0.1s, border-color 0.1s;
}
button:hover { background: #2e2e42; border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: #3f3116; border-color: var(--accent); color: #ffe6a8; font-weight: 600; }
button.primary:hover { background: #5a4520; }
button.small { font-size: 13px; padding: 5px 10px; }
.row { display: flex; gap: 12px; align-items: center; }
.row.between { justify-content: space-between; }
.footer-row { margin-top: 18px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.shards { color: var(--accent2); font-weight: 600; }
.muted { color: var(--muted); font-size: 13px; }
.help { color: var(--muted); font-size: 13px; line-height: 1.5; }
kbd {
  background: #2b2b3a; border: 1px solid #4a4a60; border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #fff;
}

/* Hero select */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.hero-card {
  border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px;
  background: #16161f; cursor: pointer; position: relative;
  transition: border-color 0.1s, transform 0.1s;
}
.hero-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.hero-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,169,74,0.4); }
.hero-card.locked { opacity: 0.6; }
.hero-symbol {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 24px; color: #0b0b10; margin: 0 auto 8px;
}
.hero-name { font-weight: 700; text-align: center; }
.hero-title { color: var(--muted); font-size: 12px; text-align: center; margin-bottom: 6px; }
.hero-level { text-align: center; font-size: 13px; color: var(--accent2); }
.hero-detail { margin-top: 14px; padding: 12px; background: #12121a; border-radius: 8px; border: 1px solid #26263a; }
.stat-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.stat-line span b { color: var(--accent); }
.skill-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.skill-item { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.skill-key {
  min-width: 26px; height: 26px; border-radius: 5px; background: #2b2b3a;
  display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent);
}
.xpbar { height: 6px; background: #26263a; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.xpbar > div { height: 100%; background: var(--accent2); }

/* Meta shop */
.upgrade-list { display: flex; flex-direction: column; gap: 8px; }
.upgrade {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  padding: 10px 12px; background: #16161f; border: 1px solid #26263a; border-radius: 8px;
}
.upgrade .name { font-weight: 600; }
.upgrade .desc { color: var(--muted); font-size: 13px; }
.pips { display: flex; gap: 4px; }
.pip { width: 10px; height: 10px; border-radius: 2px; background: #2b2b3a; border: 1px solid #3a3a52; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tab { padding: 6px 14px; border-radius: 6px; background: #1c1c28; cursor: pointer; border: 1px solid transparent; }
.tab.active { border-color: var(--accent); color: var(--accent); }

/* Inventory */
.inv-panel { min-width: 720px; }
.inv-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 18px; }
.equip-slots { display: flex; flex-direction: column; gap: 8px; }
.slot {
  display: flex; gap: 10px; align-items: center;
  padding: 8px 10px; background: #16161f; border: 1px solid #26263a; border-radius: 8px; min-height: 52px;
  cursor: pointer;
}
.slot:hover { border-color: var(--accent); }
.slot .slot-label { color: var(--muted); font-size: 12px; width: 70px; }
.item-icon {
  width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
  background: #22222f; border: 1px solid #3a3a52;
}
.item-name { font-weight: 600; font-size: 14px; }
.item-stats { color: var(--muted); font-size: 12px; }
.rarity-common { color: var(--common); }
.rarity-rare { color: var(--rare); }
.rarity-epic { color: var(--epic); }
.item-icon.rarity-common { border-color: #666; }
.item-icon.rarity-rare { border-color: var(--rare); box-shadow: 0 0 6px rgba(90,169,255,0.4); }
.item-icon.rarity-epic { border-color: var(--epic); box-shadow: 0 0 8px rgba(199,125,255,0.5); }
.bag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bag-slot {
  min-height: 74px; background: #16161f; border: 1px solid #26263a; border-radius: 8px;
  padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center;
}
.bag-slot:hover { border-color: var(--accent); }
.bag-slot.empty { opacity: 0.4; cursor: default; }
.bag-slot .item-name { font-size: 12px; line-height: 1.2; }
.item-tip {
  margin-top: 12px; padding: 10px 12px; background: #12121a; border: 1px solid #26263a; border-radius: 8px; min-height: 84px; font-size: 13px;
}
.item-tip .actions { margin-top: 8px; display: flex; gap: 8px; }
.compare { color: var(--good); }
.compare.neg { color: var(--danger); }
.player-stats { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.player-stats b { color: var(--text); }

/* Shop */
.shop-items { display: flex; flex-direction: column; gap: 8px; }
.shop-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; background: #16161f; border: 1px solid #26263a; border-radius: 8px; }
.gold { color: var(--accent); font-weight: 600; }

/* Results */
.result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin: 14px 0; font-size: 15px; }
.result-stats b { color: var(--accent); }
.banner-death h1 { color: var(--danger); }
.banner-win h1 { color: var(--good); }
.start-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.start-item { padding: 10px; background: #16161f; border: 1px solid #26263a; border-radius: 8px; cursor: pointer; }
.start-item:hover { border-color: var(--accent); }
.start-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,169,74,0.4); }
.start-item.locked { opacity: 0.55; }
</style>
</head>
<body>
<div id="game-root">
  <canvas id="game" width="1024" height="640"></canvas>
  <div id="ui"></div>
</div>
<script>
'use strict';
// ---- js/utils.js ----
// Общие утилиты: RNG, математика, геометрия.

const TILE = 32;
const VIEW_W = 1024;
const VIEW_H = 640;

class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    // mulberry32
    this.s = (this.s + 0x6D2B79F5) | 0;
    let t = Math.imul(this.s ^ (this.s >>> 15), 1 | this.s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  float(a = 0, b = 1) { return a + this.next() * (b - a); }
  int(a, b) { return Math.floor(this.float(a, b + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  weighted(arr, wfn) {
    let total = 0;
    for (const it of arr) total += wfn(it);
    let r = this.next() * total;
    for (const it of arr) { r -= wfn(it); if (r <= 0) return it; }
    return arr[arr.length - 1];
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
}

// Общий RNG для боя/лута (несидированный от пола).
const R = new RNG((Date.now() ^ 0x9E3779B9) >>> 0);

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angleDiff = (a, b) => {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
};
const fmt = (n) => (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('ru-RU') : String(Math.round(n)));
const pct = (n) => Math.round(n * 100) + '%';
const sign = (n) => (n > 0 ? '+' : '') + n;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Бресенхем для проверки видимости между тайлами.
function lineOfSight(map, x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  let x = x0, y = y0;
  for (let i = 0; i < 200; i++) {
    if (x === x1 && y === y1) return true;
    if (!(x === x0 && y === y0) && map.isWall(x, y)) return false;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += sx; }
    if (e2 <= dx) { err += dx; y += sy; }
  }
  return false;
}

if (typeof module !== 'undefined') module.exports = { RNG, clamp, lerp, dist, angleTo, angleDiff, lineOfSight, TILE };

// ---------- Умения ----------

// ---- js/save.js ----
// Постоянный прогресс между забегами (localStorage).

const SAVE_KEY = 'shadows-undermountain-save-v1';

function defaultSave() {
  const heroes = {};
  for (const h of HEROES) heroes[h.id] = { xp: 0, level: 1, unlocked: h.unlockCost === 0, runs: 0, wins: 0 };
  return {
    shards: 0,
    heroes,
    upgrades: {},
    startItems: { startNone: true },
    stats: { runs: 0, kills: 0, bestFloor: 0, wins: 0, bossKills: 0 },
    lastHero: 'arator',
    lastStartItem: 'startNone',
  };
}

const Save = {
  data: null,
  load() {
    let d = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) { d = null; }
    const def = defaultSave();
    if (!d) d = def;
    // Мягкая миграция: доклеиваем недостающие поля.
    for (const k of Object.keys(def)) if (d[k] === undefined) d[k] = def[k];
    for (const h of HEROES) if (!d.heroes[h.id]) d.heroes[h.id] = def.heroes[h.id];
    this.data = d;
    return d;
  },
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* приватный режим и т.п. */ }
  },
  reset() { this.data = defaultSave(); this.save(); },
  hero(id) { return this.data.heroes[id]; },
  rank(upId) { return this.data.upgrades[upId] || 0; },
  // Итоговые модификаторы мета-прокачки.
  bonuses() {
    const s = { hpMult: 1, dmgMult: 1, speedMult: 1, cdr: 0, startPotions: 0, startGold: 0, xpMult: 1, potionMult: 1, dropMult: 1 };
    for (const u of UPGRADES) { const r = this.rank(u.id); if (r > 0) u.apply(s, r); }
    return s;
  },
  // Начисление опыта герою; возвращает число полученных уровней.
  addHeroXp(id, amount) {
    const h = this.hero(id);
    h.xp += amount;
    let ups = 0;
    while (h.level < MAX_LEVEL && h.xp >= xpToNext(h.level)) { h.xp -= xpToNext(h.level); h.level++; ups++; }
    if (h.level >= MAX_LEVEL) h.xp = Math.min(h.xp, xpToNext(h.level) - 1);
    return ups;
  },
};

// ---- js/dungeon.js ----
// Генерация этажей: комнаты + коридоры, арены боссов, туман войны.

const T_WALL = 0, T_FLOOR = 1, T_STAIRS = 2, T_PILLAR = 3;

class GameMap {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.tiles = new Uint8Array(w * h);
    this.explored = new Uint8Array(w * h);
    this.visible = new Uint8Array(w * h);
    this.rooms = [];
    this.torches = [];
    this.decor = [];
  }
  idx(x, y) { return y * this.w + x; }
  inBounds(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  get(x, y) { return this.inBounds(x, y) ? this.tiles[this.idx(x, y)] : T_WALL; }
  set(x, y, t) { if (this.inBounds(x, y)) this.tiles[this.idx(x, y)] = t; }
  isWall(x, y) { const t = this.get(x, y); return t === T_WALL || t === T_PILLAR; }
  isWalkable(x, y) { return !this.isWall(x, y); }
  // Проверка круга (в пикселях) на столкновение со стенами.
  circleBlocked(px, py, r) {
    const x0 = Math.floor((px - r) / TILE), x1 = Math.floor((px + r) / TILE);
    const y0 = Math.floor((py - r) / TILE), y1 = Math.floor((py + r) / TILE);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (!this.isWall(x, y)) continue;
      // Ближайшая точка тайла к центру круга.
      const cx = clamp(px, x * TILE, x * TILE + TILE), cy = clamp(py, y * TILE, y * TILE + TILE);
      if ((cx - px) ** 2 + (cy - py) ** 2 < r * r) return true;
    }
    return false;
  }
  // Обновление видимости вокруг точки (в тайлах).
  updateVisibility(cx, cy, radius) {
    this.visible.fill(0);
    const r2 = radius * radius;
    for (let y = cy - radius; y <= cy + radius; y++) {
      for (let x = cx - radius; x <= cx + radius; x++) {
        if (!this.inBounds(x, y)) continue;
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy > r2) continue;
        if (lineOfSight(this, cx, cy, x, y)) {
          const i = this.idx(x, y);
          this.visible[i] = 1; this.explored[i] = 1;
        }
      }
    }
  }
  // BFS-поле расстояний от тайла (для навигации врагов).
  flowField(tx, ty) {
    const dist = new Int16Array(this.w * this.h).fill(-1);
    if (!this.inBounds(tx, ty) || this.isWall(tx, ty)) return dist;
    const q = [this.idx(tx, ty)];
    dist[q[0]] = 0;
    let head = 0;
    while (head < q.length) {
      const i = q[head++];
      const x = i % this.w, y = (i / this.w) | 0, d = dist[i];
      const n = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (const [nx, ny] of n) {
        if (!this.inBounds(nx, ny) || this.isWall(nx, ny)) continue;
        const j = this.idx(nx, ny);
        if (dist[j] !== -1) continue;
        dist[j] = d + 1;
        q.push(j);
      }
    }
    return dist;
  }
}

function rectsOverlap(a, b, pad) {
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}

// Возвращает { map, spawn, stairs, enemies:[{type,x,y}], chests:[{x,y}], merchant:{x,y}|null, boss:{id,x,y}|null }
function generateFloor(floor, seed) {
  const rng = new RNG(seed);
  const isBoss = BOSS_FLOORS.includes(floor);
  return isBoss ? generateBossArena(floor, rng) : generateRooms(floor, rng);
}

function generateRooms(floor, rng) {
  const W = 52 + Math.min(floor, 6) * 2, H = 38 + Math.min(floor, 6);
  const map = new GameMap(W, H);
  const rooms = [];
  const target = 8 + Math.min(floor, 5);
  for (let attempt = 0; attempt < 400 && rooms.length < target; attempt++) {
    const w = rng.int(5, 11), h = rng.int(4, 9);
    const x = rng.int(1, W - w - 2), y = rng.int(1, H - h - 2);
    const r = { x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) };
    if (rooms.some((o) => rectsOverlap(r, o, 2))) continue;
    rooms.push(r);
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map.set(xx, yy, T_FLOOR);
  }
  // Сортируем комнаты по X, чтобы коридоры шли примерно слева направо, и соединяем цепочкой.
  rooms.sort((a, b) => a.cx - b.cx);
  for (let i = 1; i < rooms.length; i++) carveCorridor(map, rooms[i - 1], rooms[i], rng);
  // Пара дополнительных петель для вариативности.
  for (let k = 0; k < 2 && rooms.length > 3; k++) {
    const a = rng.pick(rooms), b = rng.pick(rooms);
    if (a !== b) carveCorridor(map, a, b, rng);
  }
  // Колонны в больших комнатах.
  for (const r of rooms) {
    if (r.w >= 8 && r.h >= 6 && rng.chance(0.6)) {
      const n = rng.int(1, 3);
      for (let i = 0; i < n; i++) {
        const px = rng.int(r.x + 2, r.x + r.w - 3), py = rng.int(r.y + 2, r.y + r.h - 3);
        if (px !== r.cx || py !== r.cy) map.set(px, py, T_PILLAR);
      }
    }
  }
  map.rooms = rooms;
  placeTorches(map, rng);

  const first = rooms[0];
  // Лестница — в самой дальней по BFS комнате.
  const field = map.flowField(first.cx, first.cy);
  let last = rooms[rooms.length - 1], best = -1;
  for (const r of rooms) { const d = field[map.idx(r.cx, r.cy)]; if (d > best) { best = d; last = r; } }
  map.set(last.cx, last.cy, T_STAIRS);

  const spawn = { x: (first.cx + 0.5) * TILE, y: (first.cy + 0.5) * TILE };
  const stairs = { x: (last.cx + 0.5) * TILE, y: (last.cy + 0.5) * TILE };

  // Враги.
  const enemies = [];
  const pool = Object.keys(MONSTERS).filter((k) => MONSTERS[k].minFloor <= floor);
  const middle = rooms.filter((r) => r !== first);
  const totalEnemies = 9 + floor * 3;
  for (let i = 0; i < totalEnemies; i++) {
    const r = rng.pick(middle);
    const type = rng.weighted(pool, (k) => MONSTERS[k].weight * (MONSTERS[k].minFloor >= floor - 1 ? 1.5 : 1));
    const pos = randomFloorInRoom(map, r, rng);
    if (!pos) continue;
    enemies.push({ type, x: pos.x, y: pos.y });
  }

  // Сундуки.
  const chests = [];
  const chestCount = rng.int(1, 2) + (rng.chance(0.3) ? 1 : 0);
  for (let i = 0; i < chestCount; i++) {
    const r = rng.pick(middle);
    const pos = randomFloorInRoom(map, r, rng);
    if (pos) chests.push(pos);
  }

  // Торговец.
  let merchant = null;
  if (MERCHANT_FLOORS.includes(floor)) {
    const candidates = middle.filter((r) => r !== last);
    const r = rng.pick(candidates.length ? candidates : middle);
    const pos = randomFloorInRoom(map, r, rng);
    if (pos) merchant = pos;
  }
  return { map, spawn, stairs, enemies, chests, merchant, boss: null };
}

function generateBossArena(floor, rng) {
  const W = 36, H = 28;
  const map = new GameMap(W, H);
  const r = { x: 4, y: 4, w: W - 8, h: H - 8, cx: W >> 1, cy: H >> 1 };
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map.set(x, y, T_FLOOR);
  // Срезаем углы для формы арены.
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4 - i; j++) {
    map.set(r.x + i, r.y + j, T_WALL); map.set(r.x + r.w - 1 - i, r.y + j, T_WALL);
    map.set(r.x + i, r.y + r.h - 1 - j, T_WALL); map.set(r.x + r.w - 1 - i, r.y + r.h - 1 - j, T_WALL);
  }
  // Четыре колонны.
  for (const [px, py] of [[r.cx - 6, r.cy - 4], [r.cx + 6, r.cy - 4], [r.cx - 6, r.cy + 4], [r.cx + 6, r.cy + 4]]) map.set(px, py, T_PILLAR);
  map.rooms = [r];
  placeTorches(map, rng);
  // Открываем всю арену сразу.
  map.explored.fill(1);
  const spawn = { x: (r.x + 3) * TILE, y: (r.cy + 0.5) * TILE };
  const stairsTx = r.x + r.w - 3;
  map.set(stairsTx, r.cy, T_STAIRS);
  const stairs = { x: (stairsTx + 0.5) * TILE, y: (r.cy + 0.5) * TILE };
  const bossId = floor >= 10 ? 'morgul' : 'grazgot';
  return { map, spawn, stairs, enemies: [], chests: [], merchant: null, boss: { id: bossId, x: (r.cx + 4) * TILE, y: (r.cy + 0.5) * TILE } };
}

function carveCorridor(map, a, b, rng) {
  let x = a.cx, y = a.cy;
  const horizontalFirst = rng.chance(0.5);
  const carve = (cx, cy) => { if (map.get(cx, cy) === T_WALL) map.set(cx, cy, T_FLOOR); };
  const stepX = () => { while (x !== b.cx) { x += Math.sign(b.cx - x); carve(x, y); } };
  const stepY = () => { while (y !== b.cy) { y += Math.sign(b.cy - y); carve(x, y); } };
  if (horizontalFirst) { stepX(); stepY(); } else { stepY(); stepX(); }
}

function randomFloorInRoom(map, r, rng) {
  for (let i = 0; i < 20; i++) {
    const x = rng.int(r.x, r.x + r.w - 1), y = rng.int(r.y, r.y + r.h - 1);
    if (map.get(x, y) === T_FLOOR) return { x: (x + 0.5) * TILE, y: (y + 0.5) * TILE };
  }
  return null;
}

function placeTorches(map, rng) {
  map.torches = [];
  for (let y = 1; y < map.h - 1; y++) for (let x = 1; x < map.w - 1; x++) {
    if (map.get(x, y) !== T_FLOOR) continue;
    if (map.get(x, y - 1) === T_WALL && rng.chance(0.08)) map.torches.push({ x: (x + 0.5) * TILE, y: y * TILE + 4, phase: rng.float(0, 6.28) });
  }
}

if (typeof module !== 'undefined') module.exports = { GameMap, generateFloor, T_WALL, T_FLOOR, T_STAIRS, T_PILLAR };

// ---- js/entities.js ----
// Игровые сущности: герой, враги, снаряды, лут, эффекты.

class Player {
  constructor(heroDef, level, meta) {
    this.hero = heroDef;
    this.level = level;
    this.meta = meta;
    this.x = 0; this.y = 0; this.r = 12;
    this.aim = { x: 1, y: 0 };
    this.vx = 0; this.vy = 0;
    this.equipment = { weapon: null, armor: null, trinket: null };
    this.bag = [];
    this.consumables = { potion: 0, lembas: 0, fireScroll: 0, elixir: 0 };
    this.buffs = [];
    this.shield = 0; this.shieldTime = 0;
    this.attackTimer = 0;
    this.skillCds = [0, 0, 0];
    this.dodgeCd = 0;
    this.dash = null;
    this.poison = 0; this.poisonTime = 0;
    this.slowTime = 0; this.stunTime = 0;
    this.invulnTime = 0; this.hurtFlash = 0;
    this.sneak = false;
    this.gold = 0;
    this.swing = 0; this.swingAngle = 0;
    this.hp = this.maxHp;
  }
  // ---- Статы ----
  equipStat(name) {
    let v = 0;
    for (const k in this.equipment) { const it = this.equipment[k]; if (it && it.stats[name]) v += it.stats[name]; }
    return v;
  }
  buffStat(name) {
    let v = 0;
    for (const b of this.buffs) if (b.stat === name) v += b.value;
    return v;
  }
  get maxHp() {
    const base = (this.hero.hp + this.hero.hpPerLevel * (this.level - 1) + this.equipStat('hp')) * this.meta.hpMult;
    return Math.round(base);
  }
  damage() {
    const base = this.hero.dmg + this.hero.dmgPerLevel * (this.level - 1) + this.equipStat('dmg');
    return base * this.meta.dmgMult * (1 + this.buffStat('dmg'));
  }
  speed() {
    let s = (this.hero.speed + this.equipStat('speed')) * this.meta.speedMult * (1 + this.buffStat('speed'));
    if (this.slowTime > 0) s *= 0.6;
    return s;
  }
  armor() { return this.hero.armor + this.equipStat('armor') + this.buffStat('armor'); }
  crit() { return this.hero.crit + this.equipStat('crit') + this.buffStat('crit'); }
  attackCooldown() { return this.hero.attack.cooldown / (1 + this.equipStat('attackSpeed')); }
  cdr() { return clamp(this.meta.cdr + this.equipStat('cdr'), 0, 0.6); }
  lifesteal() { return this.equipStat('lifesteal'); }
  xpMult() { return this.meta.xpMult * (1 + this.equipStat('xpGain')); }
  goldMult() { return 1 + this.equipStat('goldFind'); }
  regen() { return this.equipStat('regen') + this.buffStat('regen'); }
  isInvisible() { return this.buffStat('invisible') > 0; }
  addBuff(stat, value, time) {
    // Одинаковые баффы не складываются, а обновляются.
    const ex = this.buffs.find((b) => b.stat === stat && b.value === value);
    if (ex) { ex.time = Math.max(ex.time, time); return; }
    this.buffs.push({ stat, value, time });
  }
  tickTimers(dt) {
    this.attackTimer = Math.max(0, this.attackTimer - dt);
    for (let i = 0; i < 3; i++) this.skillCds[i] = Math.max(0, this.skillCds[i] - dt);
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.invulnTime = Math.max(0, this.invulnTime - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.slowTime = Math.max(0, this.slowTime - dt);
    this.stunTime = Math.max(0, this.stunTime - dt);
    this.swing = Math.max(0, this.swing - dt);
    if (this.shieldTime > 0) { this.shieldTime -= dt; if (this.shieldTime <= 0) this.shield = 0; }
    for (let i = this.buffs.length - 1; i >= 0; i--) { this.buffs[i].time -= dt; if (this.buffs[i].time <= 0) this.buffs.splice(i, 1); }
    if (this.buffStat('invisible') <= 0) this.sneak = this.sneak && this.buffs.some((b) => b.stat === 'invisible');
  }
  bagFull() { return this.bag.length >= BAG_SIZE; }
  statsSummary() {
    return {
      'Здоровье': `${Math.round(this.hp)} / ${this.maxHp}`,
      'Урон': Math.round(this.damage()),
      'Броня': Math.round(this.armor()),
      'Скорость': Math.round(this.speed()),
      'Крит': pct(this.crit()),
      'Скорость атаки': pct(1 + this.equipStat('attackSpeed')),
      'Вампиризм': pct(this.lifesteal()),
      'Сокр. перезарядки': pct(this.cdr()),
      'Опыт': pct(this.xpMult()),
      'Золото': pct(this.goldMult()),
    };
  }
}

class Enemy {
  constructor(type, x, y, floor, bossDef) {
    const def = bossDef || MONSTERS[type];
    this.type = type; this.def = def; this.isBoss = !!bossDef;
    this.x = x; this.y = y; this.r = def.size;
    const scale = 1 + 0.13 * (floor - 1);
    const dscale = 1 + 0.09 * (floor - 1);
    this.maxHp = Math.round(def.hp * (this.isBoss ? 1 : scale));
    this.hp = this.maxHp;
    this.dmg = def.dmg * (this.isBoss ? 1 : dscale);
    this.speed = def.speed; this.armor = def.armor || 0;
    this.state = 'idle'; this.target = null;
    this.wander = { x: 0, y: 0, t: 0 };
    this.attackTimer = R.float(0, def.attackCd);
    this.windup = 0; this.windupDir = { x: 0, y: 0 };
    this.stun = 0; this.slow = 0; this.poisonDps = 0; this.poisonTime = 0;
    this.kx = 0; this.ky = 0; // отбрасывание
    this.hitFlash = 0; this.alive = true;
    this.flowTimer = R.float(0, 0.3);
    this.dir = { x: 0, y: 0 };
    this.abilityTimers = {};
    if (def.abilities) for (const k in def.abilities) this.abilityTimers[k] = def.abilities[k] * 0.6;
    this.charge = null; this.phase = 1;
    this.telegraph = null; // {x,y,r,time,total,type}
    this.stuckTimer = 0; this.lastX = x; this.lastY = y;
  }
}

class Projectile {
  constructor(o) {
    Object.assign(this, { pierce: 0, size: 4, color: '#fff', life: 1.5, explode: 0, stun: 0, slow: 0, crit: false, spin: false, poison: 0, hit: new Set(), angle: 0 }, o);
    this.angle = Math.atan2(this.vy, this.vx);
  }
}

class Pickup {
  constructor(x, y, kind, payload) {
    this.x = x; this.y = y; this.kind = kind; // 'item' | 'gold' | 'consumable'
    Object.assign(this, payload);
    this.bob = R.float(0, 6.28); this.age = 0;
    const a = R.float(0, 6.28), s = R.float(30, 80);
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
  }
}

class Chest { constructor(x, y) { this.x = x; this.y = y; this.opened = false; this.r = 14; } }
class Merchant { constructor(x, y, items) { this.x = x; this.y = y; this.items = items; this.r = 14; } }

// ---------- Генерация предметов ----------
let ITEM_UID = 1;
function rollRarity(floor, luck = 1) {
  const w = { common: RARITY.common.weight, rare: RARITY.rare.weight * (1 + floor * 0.08) * luck, epic: RARITY.epic.weight * (1 + floor * 0.15) * luck };
  return R.weighted(['common', 'rare', 'epic'], (k) => w[k]);
}
function makeItem(baseId, rarity) {
  const base = ITEM_BASE_BY_ID[baseId];
  const rar = RARITY[rarity];
  const stats = {};
  for (const k in base.stats) stats[k] = roundStat(k, base.stats[k] * (base.stats[k] < 0 ? 1 : rar.mult));
  // Аффиксы редких/эпических предметов.
  const pool = AFFIXES.filter((a) => !(a.stat in stats));
  const picked = R.shuffle(pool.slice()).slice(0, rar.affixes);
  for (const a of picked) stats[a.stat] = roundStat(a.stat, R.float(a.min, a.max));
  const name = base.name + RARITY_SUFFIX[rarity];
  const price = Math.round((30 + base.tier * 18) * rar.price);
  return { uid: ITEM_UID++, base: baseId, slot: base.slot, name, icon: base.icon, rarity, stats, price, tier: base.tier };
}
function roundStat(k, v) {
  if (['dmg', 'hp', 'armor', 'speed'].includes(k)) return Math.round(v);
  return Math.round(v * 100) / 100;
}
function randomItem(floor, luck = 1) {
  const pool = ITEM_BASES.filter((b) => b.tier <= floor + 1);
  const base = R.weighted(pool, (b) => (b.tier >= floor - 2 ? 3 : 1));
  return makeItem(base.id, rollRarity(floor, luck));
}
function randomConsumable() {
  const keys = Object.keys(CONSUMABLES);
  return R.weighted(keys, (k) => CONSUMABLES[k].weight);
}
function itemStatsText(item) {
  return Object.entries(item.stats).map(([k, v]) => `${STAT_NAMES[k]} ${STAT_FMT[k](v)}`).join(', ');
}

if (typeof module !== 'undefined') module.exports = { Player, Enemy, Projectile, Pickup, Chest, Merchant, makeItem, randomItem, rollRarity, randomConsumable, itemStatsText };

// ---- js/render.js ----
// Отрисовка: карта, сущности, эффекты, HUD.

const COLORS = {
  floor: '#24242f', floorAlt: '#20202a', wall: '#3a3a4e', wallTop: '#4a4a62', wallEdge: '#2a2a3a', pillar: '#55556e',
  stairs: '#d4a94a', fog: 'rgba(5,5,10,0.55)', gold: '#ffd54f', chest: '#b8863b', merchant: '#6fc3df',
};

function drawShape(ctx, shape, x, y, r, color, angle = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (shape === 'circle') ctx.arc(x, y, r, 0, Math.PI * 2);
  else if (shape === 'square') { ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.rect(-r, -r, r * 2, r * 2); ctx.restore(); }
  else if (shape === 'tri') { ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.moveTo(r, 0); ctx.lineTo(-r * 0.8, r * 0.85); ctx.lineTo(-r * 0.8, -r * 0.85); ctx.closePath(); ctx.restore(); }
  else if (shape === 'diamond') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
  else if (shape === 'hex') { for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); }
  ctx.fill();
}

class Renderer {
  constructor(game) { this.g = game; this.ctx = game.ctx; }
  render() {
    const g = this.g, ctx = this.ctx;
    ctx.fillStyle = '#07070b'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (!g.map || !g.player) return;
    ctx.save();
    let sx = 0, sy = 0;
    if (g.shake > 0) { sx = (Math.random() - 0.5) * g.shake; sy = (Math.random() - 0.5) * g.shake; }
    ctx.translate(-Math.round(g.camera.x) + sx, -Math.round(g.camera.y) + sy);
    this.drawMap();
    this.drawTorches();
    this.drawChests();
    this.drawMerchant();
    this.drawPickups();
    this.drawTelegraphs();
    this.drawEnemies();
    this.drawPlayer();
    this.drawProjectiles();
    this.drawEffects();
    this.drawParticles();
    this.drawTexts();
    ctx.restore();
    this.drawHud();
  }
  drawMap() {
    const g = this.g, ctx = this.ctx, map = g.map;
    const x0 = Math.max(0, Math.floor(g.camera.x / TILE) - 1), y0 = Math.max(0, Math.floor(g.camera.y / TILE) - 1);
    const x1 = Math.min(map.w - 1, Math.ceil((g.camera.x + VIEW_W) / TILE) + 1), y1 = Math.min(map.h - 1, Math.ceil((g.camera.y + VIEW_H) / TILE) + 1);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = map.idx(x, y);
      if (!map.explored[i]) continue;
      const t = map.tiles[i], px = x * TILE, py = y * TILE;
      if (t === T_WALL) {
        // Стены рисуем только если рядом есть пол (видимая грань).
        let nearFloor = false;
        for (let oy = -1; oy <= 1 && !nearFloor; oy++) for (let ox = -1; ox <= 1; ox++) if (map.get(x + ox, y + oy) !== T_WALL && map.get(x + ox, y + oy) !== T_PILLAR) { nearFloor = true; break; }
        if (!nearFloor) continue;
        ctx.fillStyle = COLORS.wall; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = COLORS.wallTop; ctx.fillRect(px, py, TILE, 6);
        if (map.get(x, y + 1) !== T_WALL) { ctx.fillStyle = COLORS.wallEdge; ctx.fillRect(px, py + TILE - 5, TILE, 5); }
      } else if (t === T_PILLAR) {
        ctx.fillStyle = COLORS.floor; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = COLORS.pillar; ctx.beginPath(); ctx.roundRect(px + 5, py + 3, TILE - 10, TILE - 6, 6); ctx.fill();
        ctx.fillStyle = '#6a6a88'; ctx.fillRect(px + 8, py + 5, TILE - 16, 4);
      } else {
        ctx.fillStyle = ((x + y) & 1) ? COLORS.floor : COLORS.floorAlt; ctx.fillRect(px, py, TILE, TILE);
        if (t === T_STAIRS) {
          ctx.fillStyle = g.stairsOpen ? '#2a2412' : '#1a1a20'; ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
          ctx.strokeStyle = g.stairsOpen ? COLORS.stairs : '#555'; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
          ctx.fillStyle = g.stairsOpen ? COLORS.stairs : '#666'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(g.stairsOpen ? '>' : '×', px + TILE / 2, py + TILE / 2 + 1);
        }
      }
      if (!map.visible[i]) { ctx.fillStyle = COLORS.fog; ctx.fillRect(px, py, TILE, TILE); }
    }
  }
  drawTorches() {
    const g = this.g, ctx = this.ctx, map = g.map;
    for (const t of map.torches) {
      const tx = Math.floor(t.x / TILE), ty = Math.floor(t.y / TILE);
      if (!map.visible[map.idx(tx, ty)]) continue;
      if (t.x < g.camera.x - 80 || t.x > g.camera.x + VIEW_W + 80 || t.y < g.camera.y - 80 || t.y > g.camera.y + VIEW_H + 80) continue;
      const fl = 0.85 + Math.sin(g.time * 9 + t.phase) * 0.15;
      const grad = ctx.createRadialGradient(t.x, t.y + 6, 2, t.x, t.y + 6, 60 * fl);
      grad.addColorStop(0, 'rgba(255,170,60,0.35)'); grad.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = grad; ctx.fillRect(t.x - 70, t.y - 70, 140, 140);
      ctx.fillStyle = '#7a4a1e'; ctx.fillRect(t.x - 2, t.y, 4, 10);
      ctx.fillStyle = `rgba(255,${160 + Math.round(60 * fl)},60,1)`; ctx.beginPath(); ctx.arc(t.x, t.y - 1, 4 * fl, 0, Math.PI * 2); ctx.fill();
    }
  }
  visibleAt(x, y) { const m = this.g.map; return m.visible[m.idx(Math.floor(x / TILE), Math.floor(y / TILE))]; }
  drawChests() {
    const ctx = this.ctx;
    for (const c of this.g.chests) {
      if (!this.visibleAt(c.x, c.y) && !this.g.map.explored[this.g.map.idx(Math.floor(c.x / TILE), Math.floor(c.y / TILE))]) continue;
      ctx.fillStyle = c.opened ? '#5a4a2a' : COLORS.chest;
      ctx.beginPath(); ctx.roundRect(c.x - 13, c.y - 9, 26, 18, 4); ctx.fill();
      ctx.fillStyle = c.opened ? '#3a3020' : '#7a5a25'; ctx.fillRect(c.x - 13, c.y - 3, 26, 3);
      if (!c.opened) { ctx.fillStyle = COLORS.gold; ctx.fillRect(c.x - 2, c.y - 4, 4, 6); }
    }
  }
  drawMerchant() {
    const m = this.g.merchant, ctx = this.ctx;
    if (!m || !this.g.map.explored[this.g.map.idx(Math.floor(m.x / TILE), Math.floor(m.y / TILE))]) return;
    ctx.fillStyle = '#1f3a44'; ctx.beginPath(); ctx.roundRect(m.x - 22, m.y + 10, 44, 10, 3); ctx.fill();
    drawShape(ctx, 'circle', m.x, m.y, 13, COLORS.merchant);
    ctx.fillStyle = '#0b0b10'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', m.x, m.y + 1);
    const d = dist(m.x, m.y, this.g.player.x, this.g.player.y);
    ctx.fillStyle = '#e6e2d3'; ctx.font = '12px sans-serif'; ctx.fillText(d < 60 ? '[E] Торговать' : 'Торговец', m.x, m.y - 22);
  }
  drawPickups() {
    const ctx = this.ctx, g = this.g;
    for (const it of g.pickups) {
      if (!this.visibleAt(it.x, it.y)) continue;
      const bob = Math.sin(g.time * 4 + it.bob) * 2;
      if (it.kind === 'gold') { ctx.fillStyle = COLORS.gold; ctx.beginPath(); ctx.arc(it.x, it.y + bob, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff4c2'; ctx.fillRect(it.x - 1, it.y + bob - 2, 2, 2); }
      else if (it.kind === 'consumable') { const c = CONSUMABLES[it.id]; ctx.fillStyle = c.color; ctx.beginPath(); ctx.roundRect(it.x - 7, it.y - 9 + bob, 14, 18, 3); ctx.fill(); ctx.fillStyle = '#0b0b10'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(c.icon, it.x, it.y + bob + 1); }
      else {
        const col = RARITY[it.item.rarity].color;
        ctx.save(); ctx.translate(it.x, it.y + bob); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#12121a'; ctx.fillRect(-9, -9, 18, 18); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(-9, -9, 18, 18); ctx.restore();
        ctx.fillStyle = col; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.item.icon, it.x, it.y + bob + 1);
        if (it.item.rarity !== 'common') { ctx.globalAlpha = 0.25 + Math.sin(g.time * 5) * 0.1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(it.x, it.y + bob, 16, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }

  }
  drawTelegraphs() {
    const ctx = this.ctx;
    for (const e of this.g.enemies) {
      if (!e.telegraph) continue;
      const t = e.telegraph, k = 1 - t.time / t.total;
      ctx.save(); ctx.globalAlpha = 0.25 + k * 0.35;
      if (t.type === 'circle') { ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.stroke(); }
      else if (t.type === 'charge') { ctx.translate(e.x, e.y); ctx.rotate(t.angle); ctx.fillStyle = '#ff5252'; ctx.fillRect(0, -e.r, t.len * k, e.r * 2); ctx.globalAlpha = 0.7; ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 2; ctx.strokeRect(0, -e.r, t.len, e.r * 2); }
      ctx.restore();
    }
  }
  drawEnemies() {
    const ctx = this.ctx, g = this.g;
    for (const e of g.enemies) {
      if (!this.visibleAt(e.x, e.y)) continue;
      const def = e.def;
      // Тень.
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.8, e.r * 0.9, e.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      const angle = Math.atan2(e.dir.y, e.dir.x) || 0;
      let color = def.color;
      if (e.hitFlash > 0) color = '#ffffff';
      if (e.state === 'windup') { const k = 1 - e.windup / def.windup; ctx.save(); ctx.globalAlpha = 0.4; drawShape(ctx, def.shape, e.x, e.y, e.r + 4 + k * 6, '#ff5252', angle); ctx.restore(); }
      if (e.isBoss) { ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(g.time * 4) * 0.1; drawShape(ctx, def.shape, e.x, e.y, e.r + 10, e.phase === 2 ? '#ff1744' : def.color, angle); ctx.restore(); }
      drawShape(ctx, def.shape, e.x, e.y, e.r, color, def.shape === 'tri' ? angle : (def.shape === 'square' ? angle * 0 : 0));
      ctx.fillStyle = '#0b0b10'; ctx.font = `bold ${Math.round(e.r * 1.1)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.symbol, e.x, e.y + 1);
      if (e.stun > 0) { ctx.fillStyle = '#ffd54f'; ctx.font = '12px sans-serif'; ctx.fillText('✶', e.x + Math.sin(g.time * 8) * 6, e.y - e.r - 8); }
      if (e.poisonTime > 0) { ctx.fillStyle = '#8e24aa'; ctx.beginPath(); ctx.arc(e.x + e.r, e.y - e.r, 3, 0, Math.PI * 2); ctx.fill(); }
      // Полоска здоровья.
      if (e.hp < e.maxHp && !e.isBoss) {
        const w = e.r * 2 + 6, hy = e.y - e.r - 7;
        ctx.fillStyle = '#000'; ctx.fillRect(e.x - w / 2, hy, w, 4);
        ctx.fillStyle = '#e05a4a'; ctx.fillRect(e.x - w / 2, hy, w * Math.max(0, e.hp / e.maxHp), 4);
      }
    }
  }
  drawPlayer() {
    const ctx = this.ctx, g = this.g, p = g.player, hero = g.hero;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + 10, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
    // Взмах.
    if (p.swing > 0) {
      const k = p.swing / 0.14;
      ctx.save(); ctx.globalAlpha = 0.6 * k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.swingRange, p.swingAngle - p.swingArc / 2, p.swingAngle + p.swingArc / 2); ctx.stroke();
      ctx.globalAlpha = 0.18 * k; ctx.fillStyle = hero.color; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.swingRange, p.swingAngle - p.swingArc / 2, p.swingAngle + p.swingArc / 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (p.shield > 0) { ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#c77dff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    ctx.save();

    let color = hero.color;
    if (p.hurtFlash > 0) color = '#ff5252';
    else if (p.invulnTime > 0 && Math.floor(g.time * 20) % 2 === 0 && !p.dash) color = '#ffffff';
    drawShape(ctx, 'circle', p.x, p.y, p.r, color);
    ctx.strokeStyle = '#0b0b10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#0b0b10'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hero.symbol, p.x, p.y + 1);
    // Указатель прицела.
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x + p.aim.x * (p.r + 2), p.y + p.aim.y * (p.r + 2)); ctx.lineTo(p.x + p.aim.x * (p.r + 9), p.y + p.aim.y * (p.r + 9)); ctx.stroke();
    ctx.restore();
    for (const b of p.buffs) {
      if (b.stat === 'dmg') { ctx.fillStyle = '#ffd54f'; ctx.font = '11px sans-serif'; ctx.fillText('▲', p.x - 12, p.y - p.r - 8); }
      if (b.stat === 'armor') { ctx.fillStyle = '#bdbdbd'; ctx.font = '11px sans-serif'; ctx.fillText('▣', p.x + 12, p.y - p.r - 8); }
    }
    if (p.poisonTime > 0) { ctx.fillStyle = '#8e24aa'; ctx.font = '11px sans-serif'; ctx.fillText('☠', p.x, p.y - p.r - 10); }
  }
  drawProjectiles() {
    const ctx = this.ctx;
    for (const pr of this.g.projectiles) {
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.angle);
      ctx.fillStyle = pr.color;
      if (pr.spin) { ctx.fillRect(-pr.size, -3, pr.size * 2, 6); ctx.fillRect(-3, -pr.size, 6, pr.size * 2); }
      else if (pr.owner === 'player' && pr.size <= 5) { ctx.fillRect(-10, -1.5, 16, 3); ctx.beginPath(); ctx.moveTo(6, -3); ctx.lineTo(11, 0); ctx.lineTo(6, 3); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, pr.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(-pr.size * 1.5, 0, pr.size * 0.7, 0, Math.PI * 2); ctx.fill(); }

    }
  }
  drawEffects() {
    const ctx = this.ctx;
    for (const ef of this.g.effects) {
      if (ef.type === 'ring') { const k = 1 - ef.time / ef.max; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = ef.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
      else if (ef.type === 'slash') { ctx.save(); ctx.globalAlpha = ef.time / 0.15; ctx.strokeStyle = ef.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.r, ef.angle - 0.6, ef.angle + 0.6); ctx.stroke(); ctx.restore(); }
    }
  }
  drawParticles() {
    const ctx = this.ctx;
    for (const pt of this.g.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / (pt.max || 0.6));
      ctx.fillStyle = pt.color;

  }
  drawTexts() {
    const ctx = this.ctx;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of this.g.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.font = `bold ${Math.round(13 * t.scale)}px sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
  // ---------- HUD ----------
  drawHud() {
    const ctx = this.ctx, g = this.g, p = g.player, hero = g.hero, hs = Save.hero(hero.id);
    // Затемнение при низком здоровье.
    if (p.hp / p.maxHp < 0.3) { const grad = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.8); grad.addColorStop(0, 'rgba(180,0,0,0)'); grad.addColorStop(1, `rgba(180,0,0,${0.25 + Math.sin(g.time * 5) * 0.1})`); ctx.fillStyle = grad; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    if (g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${g.flash})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    if (g.transition > 0) { ctx.fillStyle = `rgba(0,0,0,${g.transition / 0.6})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }

    drawShape(ctx, 'circle', 40, 46, 20, hero.color);
    ctx.fillStyle = '#0b0b10'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hero.symbol, 40, 47);
    ctx.textAlign = 'left'; ctx.fillStyle = '#e6e2d3'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`${hero.name}  ·  ур. ${p.level}`, 70, 24);
    // HP.
    const hpW = 205;
    ctx.fillStyle = '#2a1010'; ctx.fillRect(70, 36, hpW, 14);
    ctx.fillStyle = '#e05a4a'; ctx.fillRect(70, 36, hpW * clamp(p.hp / p.maxHp, 0, 1), 14);
    if (p.shield > 0) { ctx.fillStyle = 'rgba(199,125,255,0.8)'; ctx.fillRect(70, 36, hpW * clamp(p.shield / p.maxHp, 0, 1), 5); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, 70 + hpW / 2, 43);
    // XP.
    const need = xpToNext(hs.level);
    ctx.fillStyle = '#10202a'; ctx.fillRect(70, 56, hpW, 7);
    ctx.fillStyle = '#6fc3df'; ctx.fillRect(70, 56, hpW * clamp(hs.xp / need, 0, 1), 7);
    ctx.textAlign = 'left'; ctx.fillStyle = '#9a97a8'; ctx.font = '11px sans-serif'; ctx.fillText(`Опыт ${hs.xp} / ${need}`, 70, 74);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffd54f'; ctx.fillText(`${p.gold} зол.`, 70 + hpW, 74);
    // Этаж, осколки.
    ctx.textAlign = 'center'; ctx.fillStyle = '#e6e2d3'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`Этаж ${g.floor} / ${MAX_FLOOR}`, VIEW_W / 2, 24);
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#9a97a8'; ctx.fillText(`Убито: ${g.runStats.kills}   Осколки: +${g.runStats.shards}`, VIEW_W / 2, 42);
    // Босс.
    if (g.boss && g.boss.alive) {
      const b = g.boss, w = 420, x = (VIEW_W - w) / 2, y = 56;
      ctx.fillStyle = 'rgba(8,8,14,0.7)'; ctx.beginPath(); ctx.roundRect(x - 8, y - 6, w + 16, 32, 6); ctx.fill();
      ctx.fillStyle = '#2a1010'; ctx.fillRect(x, y + 8, w, 12);
      ctx.fillStyle = b.phase === 2 ? '#ff1744' : '#c62828'; ctx.fillRect(x, y + 8, w * clamp(b.hp / b.maxHp, 0, 1), 12);

    }

    const skW = 52, gap = 8, total = 3 * skW + 2 * gap + gap + skW;

      const sk = SKILLS[hero.skills[i]], cd = p.skillCds[i], full = sk.cooldown * (1 - p.cdr());

    }
    this.drawSkillBox(sx + 3 * (skW + gap), sy, skW, '⇢', 'Shift', p.dodgeCd, 1.4, '#9a97a8', 'Уклонение');

    const cons = [['potion', 'F'], ['lembas', 'G'], ['fireScroll', 'R'], ['elixir', 'T']];

    this.drawMinimap();

    if (g.banner) {
      const k = Math.min(1, g.banner.time / 0.5, (2.6 - Math.min(2.6, g.banner.time)) * 3 + 0.2);

      ctx.fillStyle = '#d4a94a'; ctx.font = 'bold 36px serif'; ctx.textAlign = 'center'; ctx.fillText(g.banner.text, VIEW_W / 2, VIEW_H / 2 - 8);
      if (g.banner.sub) { ctx.fillStyle = '#e6e2d3'; ctx.font = '16px sans-serif'; ctx.fillText(g.banner.sub, VIEW_W / 2, VIEW_H / 2 + 24); }

  drawSkillBox(x, y, w, icon, key, cd, full, color, name) {

  drawMinimap() {
    const ctx = this.ctx, g = this.g, map = g.map, p = g.player;
    const scale = 3, mw = map.w * scale, mh = map.h * scale, x0 = VIEW_W - mw - 12, y0 = 56;
    ctx.fillStyle = 'rgba(8,8,14,0.6)'; ctx.fillRect(x0 - 4, y0 - 4, mw + 8, mh + 8);

      if (t === T_WALL) continue;
      ctx.fillStyle = t === T_STAIRS ? '#d4a94a' : (map.visible[i] ? '#4a4a62' : '#2e2e40');
      ctx.fillRect(x0 + x * scale, y0 + y * scale, scale, scale);
    }
    if (g.merchant) { ctx.fillStyle = '#6fc3df'; ctx.fillRect(x0 + Math.floor(g.merchant.x / TILE) * scale - 1, y0 + Math.floor(g.merchant.y / TILE) * scale - 1, scale + 2, scale + 2); }

    ctx.fillStyle = g.hero.color; ctx.fillRect(x0 + Math.floor(p.x / TILE) * scale - 1, y0 + Math.floor(p.y / TILE) * scale - 1, scale + 2, scale + 2);
  }
}

// ---- js/ui.js ----
// DOM-интерфейс: меню, выбор героя, лагерь, инвентарь, торговец, результаты.

class UI {
  constructor(game) { this.g = game; this.root = document.getElementById('ui'); this.selectedItem = null; }
  hide() { this.root.innerHTML = ''; }
  render(html) { this.root.innerHTML = html; }
  bind(selector, evt, fn) { this.root.querySelectorAll(selector).forEach((el) => el.addEventListener(evt, (e) => fn(el, e))); }

  // ---------- Главное меню ----------
  showMenu() {
    const d = Save.data, st = d.stats;
    this.render(`
      <div class="overlay"><div class="panel" style="min-width:520px">
        <h1>${GAME_TITLE}</h1>
        <div class="subtitle">Rogue-like о героях, спускающихся во тьму под горами</div>
        <div class="menu-buttons">
          <button class="primary" data-a="heroes">В подземелье</button>
          <button data-a="camp">Лагерь: улучшения и снаряжение</button>
          <button data-a="help">Как играть</button>
          <button class="small" data-a="reset" style="align-self:center;margin-top:8px">Сбросить весь прогресс</button>
        </div>
        <div class="footer-row">
          <span class="shards">◆ Осколки мифрила: ${d.shards}</span>
          <span class="muted">Походов: ${st.runs} · Побед: ${st.wins} · Лучший этаж: ${st.bestFloor} · Убито: ${st.kills}</span>
        </div>
      </div></div>`);
    this.bind('[data-a=heroes]', 'click', () => this.showHeroSelect());
    this.bind('[data-a=camp]', 'click', () => this.showCamp('upgrades'));
    this.bind('[data-a=help]', 'click', () => this.showHelp(() => this.showMenu()));
    this.bind('[data-a=reset]', 'click', () => { if (confirm('Удалить весь прогресс: уровни героев, осколки, улучшения?')) { Save.reset(); this.showMenu(); } });
  }
  showHelp(back) {
    this.render(`
      <div class="overlay"><div class="panel" style="max-width:640px">
        <h2>Как играть</h2>
        <div class="help">
          <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> или стрелки — движение. Мышь — прицел. <kbd>ЛКМ</kbd> или <kbd>Пробел</kbd> — атака.</p>
          <p><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> — умения героя (с перезарядкой). <kbd>Shift</kbd> — уклонение (неуязвимость на время рывка).</p>
          <p><kbd>F</kbd> — зелье лечения, <kbd>G</kbd> — дорожный хлеб, <kbd>R</kbd> — свиток пламени, <kbd>T</kbd> — эликсир силы.</p>
          <p><kbd>I</kbd> или <kbd>Tab</kbd> — инвентарь (игра на паузе). <kbd>E</kbd> — поговорить с торговцем. <kbd>Esc</kbd> — пауза.</p>
          <h3>Правила</h3>
          <p>Подземелье из ${MAX_FLOOR} этажей. На ${BOSS_FLOORS.join(' и ')} этажах ждут боссы. Найдите лестницу <b style="color:#d4a94a">&gt;</b>, чтобы спуститься.</p>
          <p>Опыт и уровень героя <b>сохраняются навсегда</b>, даже после смерти. Погибая, вы теряете найденные предметы и золото.</p>
          <p>За убийства и боссов копятся <span class="shards">осколки мифрила</span>. В лагере на них открываются новые герои, постоянные улучшения и стартовые предметы.</p>
          <p>Сундуки открываются касанием. Предметы подбираются автоматически, пока в сумке есть место (${BAG_SIZE} ячеек). Золото тянется к герою.</p>
        </div>
        <div class="footer-row"><span></span><button data-a="back">Назад</button></div>
      </div></div>`);
    this.bind('[data-a=back]', 'click', () => back());
  }

  // ---------- Выбор героя ----------
  showHeroSelect() {
    const d = Save.data;
    this.heroId = HERO_BY_ID[d.lastHero] && d.heroes[d.lastHero].unlocked ? d.lastHero : 'arator';
    this.startItemId = d.startItems[d.lastStartItem] ? d.lastStartItem : 'startNone';
    this.renderHeroSelect();
  }
  renderHeroSelect() {
    const d = Save.data, meta = Save.bonuses();
    const cards = HEROES.map((h) => {
      const hs = d.heroes[h.id];
      const need = xpToNext(hs.level);
      return `<div class="hero-card ${h.id === this.heroId ? 'selected' : ''} ${hs.unlocked ? '' : 'locked'}" data-hero="${h.id}">
        <div class="hero-symbol" style="background:${h.color}">${h.symbol}</div>
        <div class="hero-name">${h.name}</div>
        <div class="hero-title">${h.title}</div>
        ${hs.unlocked ? `<div class="hero-level">Уровень ${hs.level}</div><div class="xpbar"><div style="width:${Math.round(100 * hs.xp / need)}%"></div></div>`
          : `<div class="hero-level" style="color:#d4a94a">🔒 ${h.unlockCost} ◆</div>`}
      </div>`;
    }).join('');
    const h = HERO_BY_ID[this.heroId], hs = d.heroes[this.heroId];
    const tmp = new Player(h, hs.level, meta);
    const skills = h.skills.map((id, i) => { const s = SKILLS[id]; return `<div class="skill-item"><div class="skill-key">${i + 1}</div><div><b>${s.icon} ${s.name}</b> <span class="muted">(${s.cooldown} с)</span><br><span class="muted">${s.desc}</span></div></div>`; }).join('');
    const starts = START_ITEMS.map((s) => {
      const unlocked = !!d.startItems[s.id];
      return `<div class="start-item ${s.id === this.startItemId ? 'selected' : ''} ${unlocked ? '' : 'locked'}" data-start="${s.id}">
        <b>${s.name}</b><div class="muted">${s.desc}</div>${unlocked ? '' : `<div class="shards" style="margin-top:4px">🔒 ${s.cost} ◆ — открыть в лагере</div>`}</div>`;
    }).join('');
    this.render(`
      <div class="overlay"><div class="panel" style="min-width:860px">
        <div class="row between"><h2 style="margin:0">Выбор героя</h2><span class="shards">◆ ${d.shards}</span></div>
        <div class="hero-grid" style="margin-top:12px">${cards}</div>
        <div class="hero-detail">
          <div class="row between"><div><b style="font-size:18px;color:${h.color}">${h.name}</b> <span class="muted">— ${h.title}</span></div>
            ${hs.unlocked ? `<span class="muted">Походов: ${hs.runs} · Побед: ${hs.wins}</span>` : `<button class="small primary" data-a="unlock" ${d.shards >= h.unlockCost ? '' : 'disabled'}>Открыть за ${h.unlockCost} ◆</button>`}</div>
          <div class="muted" style="margin:6px 0 10px">${h.desc}</div>
          <div class="stat-line">
            <span>Здоровье <b>${tmp.maxHp}</b></span><span>Урон <b>${Math.round(tmp.damage())}</b></span><span>Броня <b>${tmp.armor()}</b></span>
            <span>Скорость <b>${Math.round(tmp.speed())}</b></span><span>Крит <b>${pct(tmp.crit())}</b></span>
            <span>Атака <b>${h.attack.type === 'melee' ? 'ближняя' : 'дальняя'}</b></span>
          </div>
          <div class="skill-list">${skills}</div>
        </div>
        <h3>Стартовый предмет</h3>
        <div class="start-items">${starts}</div>
        <div class="footer-row">
          <button data-a="back">Назад</button>
          <button class="primary" data-a="start" ${hs.unlocked ? '' : 'disabled'}>Начать поход</button>
        </div>
      </div></div>`);
    this.bind('[data-hero]', 'click', (el) => { this.heroId = el.dataset.hero; this.renderHeroSelect(); });
    this.bind('[data-start]', 'click', (el) => { if (d.startItems[el.dataset.start]) { this.startItemId = el.dataset.start; this.renderHeroSelect(); } });
    this.bind('[data-a=unlock]', 'click', () => { if (d.shards >= h.unlockCost) { d.shards -= h.unlockCost; hs.unlocked = true; Save.save(); this.renderHeroSelect(); } });
    this.bind('[data-a=back]', 'click', () => this.showMenu());
    this.bind('[data-a=start]', 'click', () => this.g.startRun(this.heroId, this.startItemId));
  }

  // ---------- Лагерь ----------
  showCamp(tab) {
    const d = Save.data;
    let body = '';
    if (tab === 'upgrades') {
      body = `<div class="upgrade-list">${UPGRADES.map((u) => {
        const r = Save.rank(u.id), maxed = r >= u.max, cost = upgradeCost(u, r);
        return `<div class="upgrade"><div><div class="name">${u.name}</div><div class="desc">${u.desc}</div></div>
          <div class="pips">${Array.from({ length: u.max }, (_, i) => `<div class="pip ${i < r ? 'on' : ''}"></div>`).join('')}</div>
          <button class="small ${maxed ? '' : 'primary'}" data-up="${u.id}" ${maxed || d.shards < cost ? 'disabled' : ''}>${maxed ? 'Максимум' : cost + ' ◆'}</button></div>`;
      }).join('')}</div>`;
    } else {
      body = `<div class="upgrade-list">${START_ITEMS.filter((s) => s.cost > 0).map((s) => {
        const un = !!d.startItems[s.id];
        return `<div class="upgrade"><div><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div><div></div>
          <button class="small ${un ? '' : 'primary'}" data-si="${s.id}" ${un || d.shards < s.cost ? 'disabled' : ''}>${un ? 'Открыто' : s.cost + ' ◆'}</button></div>`;
      }).join('')}</div>`;
    }
    this.render(`
      <div class="overlay"><div class="panel" style="min-width:640px">
        <div class="row between"><h2 style="margin:0">Лагерь</h2><span class="shards">◆ ${d.shards}</span></div>
        <div class="muted" style="margin:6px 0 12px">Осколки мифрила добываются из монстров и боссов. Улучшения действуют на всех героев навсегда.</div>
        <div class="tabs"><div class="tab ${tab === 'upgrades' ? 'active' : ''}" data-tab="upgrades">Улучшения</div><div class="tab ${tab === 'items' ? 'active' : ''}" data-tab="items">Стартовые предметы</div></div>
        ${body}
        <div class="footer-row"><button data-a="back">Назад</button><button class="primary" data-a="heroes">К выбору героя</button></div>
      </div></div>`);
    this.bind('[data-tab]', 'click', (el) => this.showCamp(el.dataset.tab));
    this.bind('[data-up]', 'click', (el) => { const u = UPGRADE_BY_ID[el.dataset.up], r = Save.rank(u.id), cost = upgradeCost(u, r); if (r < u.max && d.shards >= cost) { d.shards -= cost; d.upgrades[u.id] = r + 1; Save.save(); this.showCamp('upgrades'); } });
    this.bind('[data-si]', 'click', (el) => { const s = START_ITEMS.find((x) => x.id === el.dataset.si); if (!d.startItems[s.id] && d.shards >= s.cost) { d.shards -= s.cost; d.startItems[s.id] = true; Save.save(); this.showCamp('items'); } });
    this.bind('[data-a=back]', 'click', () => this.showMenu());
    this.bind('[data-a=heroes]', 'click', () => this.showHeroSelect());
  }

  // ---------- Пауза ----------
  showPause() {
    this.render(`
      <div class="overlay"><div class="panel">
        <h2>Пауза</h2>
        <div class="menu-buttons">
          <button class="primary" data-a="resume">Продолжить</button>
          <button data-a="help">Как играть</button>
          <button data-a="abandon">Сдаться и вернуться в лагерь</button>
        </div>
      </div></div>`);
    this.bind('[data-a=resume]', 'click', () => { this.g.state = 'run'; this.hide(); });
    this.bind('[data-a=help]', 'click', () => this.showHelp(() => this.showPause()));
    this.bind('[data-a=abandon]', 'click', () => { if (confirm('Прервать поход? Найденные предметы и золото пропадут.')) this.g.playerDie('малодушие'); });
  }

  // ---------- Инвентарь ----------
  itemHtml(item, cls = '') {
    if (!item) return '';
    return `<div class="item-icon rarity-${item.rarity} ${cls}">${item.icon}</div><div><div class="item-name rarity-${item.rarity}">${item.name}</div><div class="item-stats">${itemStatsText(item)}</div></div>`;
  }
  compareHtml(item) {
    const p = this.g.player, eq = p.equipment[item.slot];
    if (!eq || eq === item) return '';
    const keys = new Set([...Object.keys(item.stats), ...Object.keys(eq.stats)]);
    return '<div style="margin-top:6px">По сравнению с надетым: ' + [...keys].map((k) => { const dv = (item.stats[k] || 0) - (eq.stats[k] || 0); if (Math.abs(dv) < 0.001) return ''; return `<span class="compare ${dv < 0 ? 'neg' : ''}">${STAT_NAMES[k]} ${STAT_FMT[k](dv)}</span>`; }).filter(Boolean).join(', ') + '</div>';
  }
  showInventory() {
    const g = this.g, p = g.player;
    const slots = [['weapon', 'Оружие'], ['armor', 'Броня'], ['trinket', 'Талисман']].map(([s, label]) => {
      const it = p.equipment[s];
      return `<div class="slot" data-slot="${s}"><div class="slot-label">${label}</div>${it ? this.itemHtml(it) : '<span class="muted">— пусто —</span>'}</div>`;
    }).join('');
    const bag = Array.from({ length: BAG_SIZE }, (_, i) => {
      const it = p.bag[i];
      if (!it) return `<div class="bag-slot empty"></div>`;
      return `<div class="bag-slot ${this.selectedItem === it ? 'selected' : ''}" data-bag="${i}"><div class="item-icon rarity-${it.rarity}">${it.icon}</div><div class="item-name rarity-${it.rarity}">${it.name}</div></div>`;
    }).join('');
    const cons = Object.keys(CONSUMABLES).map((id) => { const c = CONSUMABLES[id], n = p.consumables[id]; return `<div class="row between" style="padding:4px 0"><span><b style="color:${c.color}">${c.icon}</b> ${c.name} <span class="muted">×${n}</span><br><span class="muted">${c.desc}</span></span><button class="small" data-use="${id}" ${n > 0 ? '' : 'disabled'}>Использовать</button></div>`; }).join('');
    const sel = this.selectedItem;
    let tip = '<span class="muted">Выберите предмет в сумке или надетый предмет.</span>';
    if (sel) {
      const equipped = Object.values(p.equipment).includes(sel);
      tip = `<div class="row">${this.itemHtml(sel)}</div><div class="muted" style="margin-top:4px">${RARITY[sel.rarity].name} · цена ${sel.price} зол.</div>${equipped ? '' : this.compareHtml(sel)}
        <div class="actions">${equipped ? `<button class="small" data-a="unequip" ${p.bagFull() ? 'disabled' : ''}>Снять</button>` : `<button class="small primary" data-a="equip">Надеть</button><button class="small" data-a="drop">Выбросить</button>`}</div>`;
    }
    const stats = Object.entries(p.statsSummary()).map(([k, v]) => `${k}: <b>${v}</b>`).join(' · ');
    this.render(`
      <div class="overlay"><div class="panel inv-panel">
        <div class="row between"><h2 style="margin:0">Инвентарь</h2><span class="gold">${p.gold} зол.</span></div>
        <div class="inv-layout" style="margin-top:12px">
          <div>
            <h3 style="margin-top:0">Снаряжение</h3><div class="equip-slots">${slots}</div>
            <h3>Расходники</h3>${cons}
            <div class="player-stats">${stats}</div>
          </div>
          <div>
            <h3 style="margin-top:0">Сумка (${p.bag.length}/${BAG_SIZE})</h3>
            <div class="bag-grid">${bag}</div>
            <div class="item-tip">${tip}</div>
          </div>
        </div>
        <div class="footer-row"><span class="muted">Esc / I — закрыть</span><button class="primary" data-a="close">Закрыть</button></div>
      </div></div>`);
    this.bind('[data-bag]', 'click', (el) => { this.selectedItem = p.bag[+el.dataset.bag]; this.showInventory(); });
    this.bind('[data-slot]', 'click', (el) => { const it = p.equipment[el.dataset.slot]; if (it) { this.selectedItem = it; this.showInventory(); } });
    this.bind('[data-a=equip]', 'click', () => { g.equipItem(sel); this.selectedItem = null; this.showInventory(); });
    this.bind('[data-a=unequip]', 'click', () => { g.unequipItem(sel.slot); this.selectedItem = null; this.showInventory(); });
    this.bind('[data-a=drop]', 'click', () => { g.dropItem(sel); this.selectedItem = null; this.showInventory(); });
    this.bind('[data-use]', 'click', (el) => { g.useConsumable(el.dataset.use); this.showInventory(); });
    this.bind('[data-a=close]', 'click', () => { g.state = 'run'; this.hide(); });
  }

  // ---------- Торговец ----------
  showShop(m) {
    const g = this.g, p = g.player;
    const stock = m.items.map((en, i) => {
      if (en.kind === 'item') {
        if (en.sold) return `<div class="shop-item" style="opacity:0.4"><div class="item-icon">—</div><div class="muted">Продано</div><div></div></div>`;
        return `<div class="shop-item">${this.itemHtml(en.item)}<button class="small primary" data-buy="${i}" ${p.gold >= en.price && !p.bagFull() ? '' : 'disabled'}>${en.price} зол.</button></div>`;
      }
      const c = CONSUMABLES[en.id];
      return `<div class="shop-item"><div class="item-icon" style="color:${c.color}">${c.icon}</div><div><div class="item-name">${c.name} <span class="muted">(осталось ${en.qty})</span></div><div class="item-stats">${c.desc}</div></div><button class="small primary" data-buy="${i}" ${p.gold >= en.price && en.qty > 0 ? '' : 'disabled'}>${en.price} зол.</button></div>`;
    }).join('');
    const sell = p.bag.length ? p.bag.map((it, i) => `<div class="shop-item">${this.itemHtml(it)}<button class="small" data-sell="${i}">Продать за ${Math.round(it.price * 0.4)}</button></div>`).join('') : '<div class="muted">Сумка пуста.</div>';
    this.render(`
      <div class="overlay"><div class="panel" style="min-width:820px">
        <div class="row between"><h2 style="margin:0">Торговец</h2><span class="gold">${p.gold} зол.</span></div>
        <div class="muted" style="margin:4px 0 12px">«Товар редкий, цены честные. Почти.»</div>
        <div class="inv-layout">
          <div><h3 style="margin-top:0">Купить</h3><div class="shop-items">${stock}</div></div>
          <div><h3 style="margin-top:0">Продать (${p.bag.length}/${BAG_SIZE})</h3><div class="shop-items">${sell}</div></div>
        </div>
        <div class="footer-row"><span class="muted">Esc / E — закрыть</span><button class="primary" data-a="close">Закрыть</button></div>
      </div></div>`);
    this.bind('[data-buy]', 'click', (el) => { g.buy(m.items[+el.dataset.buy]); this.showShop(m); });
    this.bind('[data-sell]', 'click', (el) => { g.sellItem(p.bag[+el.dataset.sell]); this.showShop(m); });
    this.bind('[data-a=close]', 'click', () => { g.state = 'run'; this.hide(); });
  }

  // ---------- Результат ----------
  showResult(victory, rs, hs) {
    const g = this.g, h = g.hero;
    const mins = Math.floor(rs.time / 60), secs = Math.floor(rs.time % 60);
    this.render(`
      <div class="overlay"><div class="panel ${victory ? 'banner-win' : 'banner-death'}" style="min-width:520px">
        <h1>${victory ? 'Тень рассеяна!' : 'Герой пал'}</h1>
        <div class="subtitle">${victory ? `${h.name} прошёл все ${MAX_FLOOR} этажей Подгорья.` : `${h.name} погиб на этаже ${g.floor}${rs.killer ? ` (${rs.killer})` : ''}. Уровень сохранён, вещи потеряны.`}</div>
        <div class="result-stats">
          <div>Этаж: <b>${rs.floor}</b></div><div>Время: <b>${mins}:${String(secs).padStart(2, '0')}</b></div>
          <div>Убито врагов: <b>${rs.kills}</b></div><div>Боссов: <b>${rs.bossKills}</b></div>
          <div>Уровней получено: <b>${rs.levels}</b></div><div>Уровень героя: <b>${hs.level}</b></div>
          <div>Осколков добыто: <b class="shards">+${rs.shards} ◆</b></div><div>Всего осколков: <b class="shards">${Save.data.shards} ◆</b></div>
        </div>
        <div class="menu-buttons">
          <button class="primary" data-a="again">Снова в подземелье</button>
          <button data-a="camp">В лагерь</button>
        </div>
      </div></div>`);
    this.bind('[data-a=again]', 'click', () => { g.resetRunState(); g.state = 'menu'; this.showHeroSelect(); });
    this.bind('[data-a=camp]', 'click', () => g.toMenu());
  }
}
