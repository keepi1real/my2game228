# Выкладка игры на GitHub Pages.
#
# Pages нужно один раз включить руками: Settings -> Pages -> Source: GitHub Actions.
# Сам workflow этого сделать не может — пробовали с configure-pages
# (enablement: true), GitHub отвечает «Create Pages site failed: Resource not
# accessible by integration»: у токена Actions нет права создавать сайт.
#
# Выкладка идёт с main. Окружение github-pages по умолчанию пускает только ветку
# по умолчанию: запуск с рабочей ветки GitHub отклонял за две секунды, не начав
# ни одного шага. Рабочая ветка оставлена в триггере намеренно — если её однажды
# разрешат в настройках окружения, предпросмотр заработает сам собой.
#
# Выкладываем не корень репозитория, а собранную папку: в корне лежат tests,
# tools и .git, которым на странице делать нечего. Флаг --pwa оставляет
# service worker и .nojekyll — без них не будет ни офлайна, ни установки.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки конфликтуют; недоделанную не отменяем, чтобы страница
# не осталась в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить зависимости проверок
        run: |
          npm i --no-save playwright @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
      - name: Проверить загруженную игру
        run: node tools/test-v19-payload.js
      - name: Проверить раздельные сохранения
        run: node tools/test-v20-storage.js
      - name: Проверить расположение и рисование деталей карт
        run: |
          node tools/test-v20-map-placement.js
          node tools/test-v20-map-reachability.cjs
          node tools/test-v20-map-art.cjs
          node tools/test-v20-matte-floor.cjs
          node tools/test-v20-room-rhythm.js
          node tools/test-v20-asset-loading.js
          node tools/test-v20-readability-unit.cjs
          node tools/test-v20-readability.cjs
          node tools/test-v20-interactables.cjs
          node tools/test-v20-combat-visibility.js
          node tools/test-v20-save-atomic.js
          node tools/test-v20-save-atomic-integration.js
          node tools/test-v20-wave-recovery.js
          node tools/test-v20-wave-recovery-integration.js
          node tools/test-v20-hero-progression.cjs
          node tools/test-v20-hero-mastery-ui.cjs
          node tools/test-v21-tide-observatory-art.cjs
          node tools/test-v21-tide-observatory-route.cjs
          node tools/test-v21-chapter-compat.cjs
          node tools/test-v21-observatory-boss.cjs
      - name: Собрать папку для раздачи
        run: node tools/make-webdir.js --pwa www
      - name: Проверить запуск в браузере
        run: node tools/test-v19-browser.js
      - name: Проверить новую экспедицию в браузере
        run: node tools/test-v20-browser.js
      - name: Проверить новую главу в браузере
        run: node tools/test-v21-browser.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
