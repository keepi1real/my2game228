# Выкладка игры на GitHub Pages.
#
# Pages включены вручную (Settings -> Pages -> Source: GitHub Actions). Сам
# workflow этого сделать не может: configure-pages с enablement: true получает
# «Create Pages site failed: Resource not accessible by integration».
#
# Триггер только на main. Окружение github-pages пускает выкладку лишь с ветки
# по умолчанию — запуск с рабочей ветки GitHub отклонял за две секунды, не начав
# ни одного шага, и такие прогоны только засоряли историю.
#
# Перед выкладкой гоняются все три набора проверок, включая браузерные: раньше
# в CI шёл только tests/run.js, и сломанное управление могло уехать на страницу.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки конфликтуют; недоделанную не отменяем, чтобы страница
# не осталась в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Без браузера tests/browser.js и tests/combat.js выходят с нулём и молча
      # пропускают проверки — на своей машине это удобно, а в CI означало бы
      # зелёную выкладку без единой проверки. Здесь они обязаны отработать.
      REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Поставить браузер для проверок
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Данные и генерация
        run: node tests/run.js
      - name: Бой, движение и лут
        run: node tests/combat.js
      - name: Сенсор, телефонная вёрстка и PWA
        run: node tests/browser.js

      - name: Собрать папку для раздачи
        run: node tools/make-webdir.js --pwa www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
